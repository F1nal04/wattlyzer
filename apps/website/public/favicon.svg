<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs>
    <linearGradient id="rays" x1="0" y1="22" x2="0" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc54f"/><stop offset="1" stop-color="#f9a536"/>
    </linearGradient>
    <linearGradient id="sun" x1="100" y1="49" x2="112" y2="123" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd65a"/><stop offset="0.55" stop-color="#fcaa40"/><stop offset="1" stop-color="#f07c35"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="82" x2="0" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9a57c"/><stop offset="1" stop-color="#cf4c77"/>
    </linearGradient>
    <linearGradient id="tint" x1="24" y1="0" x2="92" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcc58e" stop-opacity="0.85"/><stop offset="1" stop-color="#fcc58e" stop-opacity="0"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <path d="M40 96 72 143 104 113 128 143 162 93" fill="none" stroke="#000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <!-- Soft shadow the W casts onto the tile. -->
    <filter id="drop" filterUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#7a2048" flood-opacity="0.28"/>
    </filter>
    <!-- Tighter shadow where the second V folds over the first. -->
    <filter id="fold" filterUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240" color-interpolation-filters="sRGB">
      <feDropShadow dx="-2.5" dy="1" stdDeviation="2" flood-color="#7a2048" flood-opacity="0.4"/>
    </filter>
    <!-- Darkens the sun along the edge the W bites into it. -->
    <filter id="sunshade" filterUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4.5"/></filter>
    <clipPath id="sunclip"><circle cx="106" cy="86" r="37"/></clipPath>
    
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fff4ef"/>
    </linearGradient></defs><rect width="200" height="200" rx="44" fill="url(#tile)"/><g transform="translate(100 100) scale(1.06) translate(-100 -100)">
    
    <path d="M106 24v17M72 36l9 13M140 36l-9 13M48 61l14 8" stroke="url(#rays)" stroke-width="7" stroke-linecap="round"/>
    <g mask="url(#cut)">
      <circle cx="106" cy="86" r="37" fill="url(#sun)"/>
      <g clip-path="url(#sunclip)" opacity="0.4">
        <path d="M40 96 72 143 104 113 128 143 162 93" fill="none" stroke="#c8433a" stroke-width="55" stroke-linecap="round" stroke-linejoin="round" filter="url(#sunshade)"/>
      </g>
    </g>
    <g fill="none" stroke-width="29" stroke-linecap="round" stroke-linejoin="round">
      <g filter="url(#drop)">
        <path d="M40 96 72 143 104 113 128 143 162 93" stroke="url(#w)"/>
        <path d="M40 96 72 143 104 113 128 143 162 93" stroke="url(#tint)"/>
      </g>
      <path d="M104 113 128 143" stroke="url(#w)" filter="url(#fold)"/>
    </g></g></svg>
