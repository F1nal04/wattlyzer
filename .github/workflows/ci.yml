name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Affected checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # Skip GitHub Actions-authored pushes and merge commits from PRs
    if: |
      github.event_name != 'push' || (
        github.actor != 'github-actions[bot]' &&
        github.event.head_commit.author.email != 'action@github.com' &&
        !contains(github.event.head_commit.message, 'Merge pull request')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set affected commit range
        uses: nrwl/nx-set-shas@v4

      - name: Lint, typecheck, test and build affected projects
        run: bun run affected
